# 매일 밤 전체 검사: develop을 빌드해 E2E 전체(e2e/suites.json의 nightly)와 Lighthouse 성능 기준을 돌린다
#  - PR마다 도는 검사(ci.yml)는 빨리 끝나도록 자주 쓰는 흐름만 본다. 나머지 시험이 몰래 깨지지 않게 밤마다 다 돌린다
#  - 결과는 Actions 실행 화면의 Summary 표(시험마다 ✅/❌·시간, 화면마다 점수)
#  - 손으로 돌리기: Actions → "매일 밤 전체 검사" → Run workflow (브랜치 고를 수 있음)
# 전략: docs/03-test-strategy.md
name: 매일 밤 전체 검사

on:
  schedule:
    - cron: "0 18 * * *" # 한국 시간 새벽 3시 (UTC 18시)
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    name: 전체 E2E·성능
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      # 이 작업 동안만 있는 빈 DB. 끝나면 사라진다
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blogville
          POSTGRES_PASSWORD: blogville
          POSTGRES_DB: blogville
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blogville"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 앱·DB 스크립트·E2E가 모두 .env.local을 읽는다. 비밀 값은 실행할 때마다 새로 만드는 임시 값이다
      - name: 임시 .env.local 만들기
        run: |
          secret="$(openssl rand -hex 32)"
          admin_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          echo "::add-mask::$admin_pw"
          umask 077
          {
            echo "DATABASE_URL=postgres://blogville:blogville@localhost:5432/blogville"
            echo "BETTER_AUTH_SECRET=$secret"
            echo "BETTER_AUTH_URL=$E2E_BASE"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=$admin_pw"
          } > .env.local

      # Turbopack 빌드는 한글이 든 코드 위치 표시에서 멈추는 문제가 있어 Dockerfile처럼 webpack으로 빌드한다
      - name: 빌드 (next build --webpack)
        run: npx next build --webpack

      - name: DB 준비 (표 → 아이템 → 관리자)
        run: |
          npm run db:migrate
          npm run db:seed
          npm run admin:create

      - name: 브라우저 설치 (Playwright chromium)
        run: npx playwright install --with-deps chromium

      - name: 앱 띄우기
        run: |
          nohup npx next start -p 3000 > app.log 2>&1 &
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE/" || true)"
            [ "$code" = 200 ] && { echo "첫 화면 응답 200 (${i}초)"; exit 0; }
            sleep 1
          done
          echo "::error::앱이 60초 안에 응답하지 않았어요"
          cat app.log
          exit 1

      - name: E2E 전체 (e2e/suites.json의 nightly)
        id: e2e
        run: node scripts/e2e-run.mjs nightly

      # E2E가 실패해도 성능은 따로 잰다
      - name: Lighthouse 성능 기준 (scripts/lighthouse.mjs)
        if: success() || steps.e2e.outcome == 'failure'
        run: node scripts/lighthouse.mjs

      # 실패하면 스크린샷과 앱 로그를 Actions 화면의 Artifacts에서 내려받아 볼 수 있다
      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failure
          path: |
            e2e-shots/
            lighthouse/
            app.log
          retention-days: 7
