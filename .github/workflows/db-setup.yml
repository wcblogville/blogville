# 크로우풋 DB에 표 만들기 / 기본 아이템 넣기 / 관리자 계정 만들기
# GitHub 저장소 → Actions → "DB 준비" → Run workflow 버튼으로 실행한다.
# 여러 번 실행해도 안전하다 (이미 적용한 마이그레이션은 건너뛰고, 아이템·관리자는 있으면 고친다).
name: DB 준비

on:
  workflow_dispatch:

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 접속 주소 만들기
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
        run: |
          url=$(node -e 'const e=process.env, u=encodeURIComponent;
            console.log(`postgres://${u(e.DB_USERNAME)}:${u(e.DB_PASSWORD)}@${e.DB_ADDRESS}:${e.DB_PORT}/${u(e.DB_NAME)}?options=${u("-c search_path="+e.DB_SCHEMA)}`)')
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "DB_SCHEMA=$DB_SCHEMA" >> "$GITHUB_ENV"

      - name: 표 만들기 (마이그레이션)
        run: npm run db:migrate:deploy
      - name: 기본 아이템·동물 넣기
        run: npm run db:seed
      - name: 관리자 계정 만들기
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run admin:create
